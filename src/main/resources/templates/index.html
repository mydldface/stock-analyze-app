<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Fibonacci Analyzer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        body {
            background: #f5f6fa;
        }
        .card {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #chart {
            width: 100%;
            height: 500px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">
        <span class="navbar-brand">
            Fibonacci Analyzer
        </span>
        <div>
            <a class="btn btn-outline-light me-2"
               href="/stocks">
                Dashboard
            </a>
            <a class="btn btn-outline-success"
               href="/stocks/export">
                Excel Export
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Upload -->
    <div class="card mb-4">
        <div class="card-header">
            Excel Upload
        </div>

        <div class="card-body">
            <form id="uploadForm">
                <input
                        type="file"
                        class="form-control"
                        id="file"
                        name="file"
                        accept=".xlsx,.xls"
                        required>

                <button class="btn btn-primary mt-3" type="submit">
                    Analysieren
                </button>
            </form>

            <form action="/stocks/clear" method="post">
                <button class="btn btn-warning mt-3">
                    Zurücksetzen
                </button>
            </form>
        </div>
    </div>
    <!-- Chart -->
    <div class="card mb-4">
        <div class="card-header">
            Candlestick Chart
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">
                    Aktie auswählen
                </label>
                <select
                        id="symbolSelect"
                        class="form-select">
                    <option value="">
                        Bitte wählen...
                    </option>
                </select>
            </div>
            <!-- Signals -->
            <div class="card mb-3">
                <div class="card-header">
                    Aktuelles Signal
                </div>

                <div class="card-body text-center py-3">
                    <h3 id="selectedSymbol"
                        class="mb-2">
                    </h3>
                    <div id="selectedPattern"
                         class="mb-2 fw-bold fs-5">
                    </div>
                    <div id="selectedSignal">
                    </div>
                </div>
            </div>
            <!-- Legende -->
            <div id="candleLegend"
                 class="text-center small text-muted mb-2">
            </div>

            <div id="chart"></div>
        </div>
    </div>

    <!-- Ergebnisse -->

    <div class="card">
        <div class="card-header">
            Analyseergebnisse
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Pattern</th>
                        <th>Signal</th>
                        <th>Current Price</th>
                        <th>Fib 23.6</th>
                        <th>Fib 38.2</th>
                        <th>Fib 50</th>
                        <th>Fib 61.8</th>
                        <th>Fib 78.6</th>
                    </tr>
                    </thead>
                    <tbody id="resultBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
    let analysisData = [];
    let loadedResults = [];
    let fibLines = [];
    // Chart

    const chartContainer =
        document.getElementById('chart');

    const chart =
        LightweightCharts.createChart(
            chartContainer,
            {
                width: chartContainer.clientWidth,
                height: 500,

                timeScale: {
                    rightOffset: 10
                }
            }
        );

    window.addEventListener('resize', () => {

        chart.applyOptions({
            width: chartContainer.clientWidth
        });

    });

    const candleSeries =
        chart.addCandlestickSeries();

    console.log("candleSeries =", candleSeries);

    // Badge

    // Zahlenformat
    function format(value) {

        if (value === undefined ||
            value === null ||
            isNaN(value)) {

            return "-";
        }

        return Number(value).toFixed(2);
    }

    // Tabelle

    function formatNumber(value) {

        if (value === undefined ||
            value === null ||
            isNaN(value)) {

            return "-";
        }

        return Number(value).toFixed(2);
    }

    function badge(signal) {

        if (!signal) {
            return '<span class="badge bg-secondary">UNKNOWN</span>';
        }

        if (signal.includes("BUY")) {

            return `
            <span class="badge bg-success">
                ${signal}
            </span>
        `;
        }

        if (signal.includes("SELL")) {

            return `
            <span class="badge bg-danger">
                ${signal}
            </span>
        `;
        }

        if (signal.includes("WATCH")) {

            return `
            <span class="badge bg-warning text-dark">
                ${signal}
            </span>
        `;
        }

        return `
        <span class="badge bg-secondary">
            ${signal}
        </span>
    `;
    }

    function renderTable(rows) {

        const body =
            document.getElementById("resultBody");

        body.innerHTML = "";

        rows.forEach(r => {

            const fibs =
                r.fibonacciLevels || {};

            const tr =
                document.createElement("tr");

            tr.innerHTML = `

            <td>${r.symbol}</td>

            <td>${r.pattern}</td>

            <td>${badge(r.signal)}</td>

            <td>${format(r.currentPrice)}</td>

            <td>${format(fibs["23.6"])}</td>

            <td>${format(fibs["38.2"])}</td>

            <td>${format(fibs["50"])}</td>

            <td>${format(fibs["61.8"])}</td>

            <td>${format(fibs["78.6"])}</td>

        `;

            body.appendChild(tr);
        });

        console.log(
            "Anzahl Zeilen:",
            body.rows.length);

        console.log(
            "Anzahl Zeilen:",
            body.rows.length
        );

        console.log(
            body.outerHTML
        );

        document
            .querySelector("table")
            .scrollIntoView({
                behavior: "smooth"
            });
    }

    function fillSymbolSelect(rows) {

        const select =
            document.getElementById(
                "symbolSelect"
            );

        select.innerHTML =
            '<option value="">Bitte wählen...</option>';

        rows.forEach(row => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                row.symbol;

            option.textContent =
                row.symbol;

            select.appendChild(
                option
            );
        });
    }

    function fifsSafe(obj,key){

        if(!obj){
            return null;
        }

        return obj[key];
    }

    // Upload

    async function uploadFile(event) {

        event.preventDefault();

        const fileInput =
            document.getElementById("file");

        if (!fileInput) {

            console.error(
                "Datei-Input mit ID 'file' nicht gefunden."
            );

            return;
        }

        if (!fileInput.files ||
            fileInput.files.length === 0) {

            alert(
                "Bitte zuerst eine Excel-Datei auswählen."
            );

            return;
        }

        const formData =
            new FormData();

        formData.append(
            "file",
            fileInput.files[0]
        );

        try {

            console.log(
                "Upload wird gestartet..."
            );

            const response =
                await fetch(
                    "/stocks/api/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "HTTP Fehler: " +
                    response.status
                );
            }

            const data =
                await response.json();

            console.log(
                "Analyse-Ergebnis:",
                data
            );

            if (!Array.isArray(data)) {

                console.error(
                    "Backend liefert kein Array:",
                    data
                );

                alert(
                    "Ungültige Antwort vom Server."
                );

                return;
            }

            console.log("Analyse-Ergebnis:", data);

            analysisData = data;

            loadedResults = data;

            renderTable(data);

            if (data.length > 0) {
                updateSignalPanel(data[0]);
                updateChart(data[0]);
            }

            fillSymbolSelect(data);

            if (data.length > 0) {

                document
                    .getElementById(
                        "symbolSelect"
                    )
                    .value =
                    data[0].symbol;

                renderChart(
                    data[0].symbol
                );
            }

            document
                .getElementById(
                    "symbolSelect"
                )
                .addEventListener(
                    "change",
                    function () {
                        const selectedStock =
                            loadedResults.find(
                                r => r.symbol === this.value
                            );
                        if (!selectedStock) {
                            return;
                        }
                        updateSignalPanel(
                            selectedStock
                        );
                        updateChart(
                            selectedStock
                        );
                    },
                    event => {
                        renderChart(
                            event.target.value
                        );
                    }
                );

        } catch (error) {

            console.error(
                "Upload fehlgeschlagen:",
                error
            );

            alert(
                "Fehler beim Upload:\n" +
                error.message
            );
        }
    }
    console.log(
        document.getElementById("uploadForm")
    );

    window.addEventListener(
        "DOMContentLoaded",
        () => {

            const uploadForm =
                document.getElementById(
                    "uploadForm"
                );

            console.log(
                "uploadForm:",
                uploadForm
            );

            if (!uploadForm) {

                console.error(
                    "uploadForm nicht gefunden!"
                );

                return;
            }

            uploadForm.addEventListener(
                "submit",
                uploadFile
            );
        }
    );

    function renderChart(symbol) {

        const stock =
            analysisData.find(
                row => row.symbol === symbol
            );

        if (!stock) {
            candleSeries.setData([]);

            return;
        }

        candleSeries.setData([
            {
                time: "2026-10-19",
                open: stock.prevOpen,
                high: stock.prevHigh,
                low: stock.prevLow,
                close: stock.prevClose
            },
            {
                time: "2026-10-20",
                open: stock.open,
                high: stock.high,
                low: stock.low,
                close: stock.close
            }
        ]);

        document.getElementById(
            "candleLegend"
        ).innerHTML =
            "🔴 Linke Kerze = Vortageskerze" +
            "&nbsp;&nbsp;|&nbsp;&nbsp;" +
            "🟢 Rechte Kerze = Aktuelle Kerze";

        // chart.timeScale().fitContent();

        chart.timeScale().setVisibleLogicalRange({
            from: -3,
            to: 5
        });
    }

    function updateSignalPanel(stock) {
        const pattern =
            document.getElementById(
                "selectedPattern"
            );

        pattern.innerText =
            stock.pattern;

        if (
            stock.pattern.includes("BULL")
        ) {
            pattern.className =
                "text-success fw-bold fs-4";
        }
        else if (
            stock.pattern.includes("BEAR")
        ) {
            pattern.className =
                "text-danger fw-bold fs-4";
        }
        else {
            pattern.className =
                "text-secondary fw-bold fs-4";
        }
        document.getElementById(
            "selectedSymbol"
        ).textContent =
            stock.symbol;
        document.getElementById(
            "selectedSignal"
        ).innerHTML =
            badge(stock.signal);
    }
    // clearFibLines
    function clearFibLines() {

        fibLines.forEach(line => {

            candleSeries.removePriceLine(line);

        });

        fibLines = [];
    }
    // drawFibLines
    function drawFibLines(fibs) {

        clearFibLines();

        if (!fibs) {
            return;
        }

        fibLines.push(
            candleSeries.createPriceLine({
                price: fibs["23.6"],
                color: "#ff9800",
                lineWidth: 2,
                lineStyle: 0,
                axisLabelVisible: true,
                title: "23.6%"
            })
        );

        fibLines.push(
            candleSeries.createPriceLine({
                price: fibs["38.2"],
                color: "#2196f3",
                lineWidth: 2,
                title: "38.2%"
            })
        );

        fibLines.push(
            candleSeries.createPriceLine({
                price: fibs["50"],
                color: "#4caf50",
                lineWidth: 2,
                title: "50%"
            })
        );

        fibLines.push(
            candleSeries.createPriceLine({
                price: fibs["61.8"],
                color: "#e91e63",
                lineWidth: 2,
                title: "61.8%"
            })
        );

        fibLines.push(
            candleSeries.createPriceLine({
                price: fibs["78.6"],
                color: "#9c27b0",
                lineWidth: 2,
                title: "78.6%"
            })
        );
    }
    // updateChart
    function updateChart(stock) {
        candleSeries.setData([
            {
                time: "2026-10-19",
                open: stock.prevOpen,
                high: stock.prevHigh,
                low: stock.prevLow,
                close: stock.prevClose
            },
            {
                time: "2026-10-20",
                open: stock.open,
                high: stock.high,
                low: stock.low,
                close: stock.close
            }
        ]);

        drawFibLines(
            stock.fibonacciLevels
        );
    }
</script>
</body>
</html>
