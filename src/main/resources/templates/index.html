<!DOCTYPE html>
<html lang="de"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Fibonacci Analyzer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        body {
            background: #f5f6fa;
        }
        .card {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        #chart {
            width: 100%;
            height: 500px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">
        <span class="navbar-brand">
            Fibonacci Analyzer
        </span>
        <div>
            <a class="btn btn-outline-light me-2"
               href="/stocks">
                Dashboard
            </a>
            <a class="btn btn-outline-success"
               href="/stocks/export">
                Excel Export
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Upload -->
    <div class="card mb-4">
        <div class="card-header">
            Excel Upload
        </div>

        <div class="card-body">
            <form id="uploadForm">
                <input
                        type="file"
                        class="form-control"
                        id="file"
                        name="file"
                        accept=".xlsx,.xls"
                        required>

                <button class="btn btn-primary mt-3" type="submit">
                    Analysieren
                </button>
            </form>

            <form action="/stocks/clear" method="post">
                <button class="btn btn-warning mt-3">
                    Zurücksetzen
                </button>
            </form>
        </div>
    </div>
    <!-- Chart -->
    <div class="card mb-4">
        <div class="card-header">
            Candlestick Chart
        </div>
        <div class="card-body">
            <div id="chart"></div>
        </div>
    </div>

    <!-- Ergebnisse -->

    <div class="card">
        <div class="card-header">
            Analyseergebnisse
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Pattern</th>
                        <th>Signal</th>
                        <th>Current Price</th>
                        <th>Fib 23.6</th>
                        <th>Fib 38.2</th>
                        <th>Fib 50</th>
                        <th>Fib 61.8</th>
                        <th>Fib 78.6</th>
                    </tr>
                    </thead>
                    <tbody id="resultBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>

    // Chart

    const chartContainer =
        document.getElementById('chart');

    const chart =
        LightweightCharts.createChart(
            chartContainer,
            {
                width: chartContainer.clientWidth,
                height: 500
            }
        );

    window.addEventListener('resize', () => {

        chart.applyOptions({
            width: chartContainer.clientWidth
        });

    });

    const candleSeries =
        chart.addCandlestickSeries();

    console.log("candleSeries =", candleSeries);

    // Badge

    // Zahlenformat
    function format(value) {

        if (value === undefined ||
            value === null ||
            isNaN(value)) {

            return "-";
        }

        return Number(value).toFixed(2);
    }

    // Tabelle

    function formatNumber(value) {

        if (value === undefined ||
            value === null ||
            isNaN(value)) {

            return "-";
        }

        return Number(value).toFixed(2);
    }

    function badge(signal) {

        if (!signal) {
            return '<span class="badge bg-secondary">UNKNOWN</span>';
        }

        if (signal.includes("BUY")) {

            return `
            <span class="badge bg-success">
                ${signal}
            </span>
        `;
        }

        if (signal.includes("SELL")) {

            return `
            <span class="badge bg-danger">
                ${signal}
            </span>
        `;
        }

        if (signal.includes("WATCH")) {

            return `
            <span class="badge bg-warning text-dark">
                ${signal}
            </span>
        `;
        }

        return `
        <span class="badge bg-secondary">
            ${signal}
        </span>
    `;
    }

    function renderTable(rows) {

        const body =
            document.getElementById("resultBody");

        body.innerHTML = "";

        rows.forEach(r => {

            const fibs =
                r.fibonacciLevels || {};

            const tr =
                document.createElement("tr");

            tr.innerHTML = `

            <td>${r.symbol}</td>

            <td>${r.pattern}</td>

            <td>${badge(r.signal)}</td>

            <td>${format(r.currentPrice)}</td>

            <td>${format(fibs["23.6"])}</td>

            <td>${format(fibs["38.2"])}</td>

            <td>${format(fibs["50"])}</td>

            <td>${format(fibs["61.8"])}</td>

            <td>${format(fibs["78.6"])}</td>

        `;

            body.appendChild(tr);
        });

        console.log(
            "Anzahl Zeilen:",
            body.rows.length);

        console.log(
            "Anzahl Zeilen:",
            body.rows.length
        );

        console.log(
            body.outerHTML
        );

        document
            .querySelector("table")
            .scrollIntoView({
                behavior: "smooth"
            });
    }

    function fifsSafe(obj,key){

        if(!obj){
            return null;
        }

        return obj[key];
    }

    // Upload

    async function uploadFile(event) {

        event.preventDefault();

        const fileInput =
            document.getElementById("file");

        if (!fileInput) {

            console.error(
                "Datei-Input mit ID 'file' nicht gefunden."
            );

            return;
        }

        if (!fileInput.files ||
            fileInput.files.length === 0) {

            alert(
                "Bitte zuerst eine Excel-Datei auswählen."
            );

            return;
        }

        const formData =
            new FormData();

        formData.append(
            "file",
            fileInput.files[0]
        );

        try {

            console.log(
                "Upload wird gestartet..."
            );

            const response =
                await fetch(
                    "/stocks/api/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "HTTP Fehler: " +
                    response.status
                );
            }

            const data =
                await response.json();

            console.log(
                "Analyse-Ergebnis:",
                data
            );

            if (!Array.isArray(data)) {

                console.error(
                    "Backend liefert kein Array:",
                    data
                );

                alert(
                    "Ungültige Antwort vom Server."
                );

                return;
            }

            console.log("Analyse-Ergebnis:", data);

            renderTable(data);

            renderChart(data);

        } catch (error) {

            console.error(
                "Upload fehlgeschlagen:",
                error
            );

            alert(
                "Fehler beim Upload:\n" +
                error.message
            );
        }
    }
    console.log(
        document.getElementById("uploadForm")
    );

    window.addEventListener(
        "DOMContentLoaded",
        () => {

            const uploadForm =
                document.getElementById(
                    "uploadForm"
                );

            console.log(
                "uploadForm:",
                uploadForm
            );

            if (!uploadForm) {

                console.error(
                    "uploadForm nicht gefunden!"
                );

                return;
            }

            uploadForm.addEventListener(
                "submit",
                uploadFile
            );
        }
    );

    function renderChart(rows) {

        const chartData =
            rows.map((row, index) => ({

                time: (index + 1).toString(),

                open: row.open,

                high: row.high,

                low: row.low,

                close: row.close

            }));

        candleSeries.setData(
            chartData
        );
    }


</script>
</body>
</html>
